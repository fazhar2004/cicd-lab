
name: Spring Boot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test application
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify

      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: springboot-application
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
